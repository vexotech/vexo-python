[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vexo-python"
dynamic = ["version"]
description = "Send server-side events and identifies to Vexo from Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = []
keywords = ["vexo", "analytics", "server-side", "events"]

[project.urls]
Homepage = "https://docs.vexo.co/server-side/capture"
Source = "https://github.com/vexotech/vexo-python"

[tool.setuptools]
packages = ["vexo"]

[tool.setuptools.dynamic]
version = { attr = "vexo.__version__" }
