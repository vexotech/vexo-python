[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vexo-python"
version = "0.1.0"
description = "Send server-side events and identifies to Vexo from Python."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = []

[project.urls]
Documentation = "https://docs.vexo.co/server-side/capture"

[tool.setuptools]
packages = ["vexo"]
