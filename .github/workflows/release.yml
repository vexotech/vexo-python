name: release

# Publishes to PyPI when a GitHub release is published, through PyPI trusted publishing (OIDC): the repository holds
# no PyPI token.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - run: python -m unittest
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
